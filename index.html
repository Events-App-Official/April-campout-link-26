<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join Event</title>

<script>
window.onload = function () {
  const eventId = "69dbc3655e932ed7fc3cc384";

  const appUrl = `events://yourEvent/${eventId}`;
  const iosStore =
    "https://apps.apple.com/us/app/events-the-app-for-scouts/id6748885673";
  const androidStore =
    "https://play.google.com/store/apps/details?id=com.eventsapp.events";

  const userAgent = navigator.userAgent || navigator.vendor || window.opera;

  // Try opening app
  window.location = appUrl;

  // Fallback after delay
  setTimeout(function () {
    if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
      window.location = iosStore;
    } else if (/android/i.test(userAgent)) {
      window.location = androidStore;
    }
  }, 1500);
};
</script>

body {
  margin: 0;
  background: #0f0f0f;

}
</style>
</head>

</div>
</body>
</html>
